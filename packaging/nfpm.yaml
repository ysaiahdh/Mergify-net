# Built by scripts/build-linux.sh: VERSION=0.2.1 ARCH=amd64 nfpm package -p deb -f packaging/nfpm.yaml
name: mergify-net
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Ysaïah Dhellemmes Hounkanlin <206241240+ysaiahdh@users.noreply.github.com>
vendor: Ysaïah Dhellemmes Hounkanlin
homepage: https://github.com/ysaiahdh/net-merge
license: MIT
description: |
  Use all your network adapters at once.
  mergify-net spreads every new connection over Wi-Fi, Ethernet and phone
  tethers, so downloads, games and browsers get the combined speed. It needs
  no server and no VPN. The tray icon needs StatusNotifierItem support.
contents:
  - src: ./mergify-net
    dst: /usr/bin/mergify-net
    file_info:
      mode: 0755
  - src: packaging/io.github.ysaiahdh.mergify-net.desktop
    dst: /usr/share/applications/io.github.ysaiahdh.mergify-net.desktop
  - src: packaging/io.github.ysaiahdh.mergify-net.metainfo.xml
    dst: /usr/share/metainfo/io.github.ysaiahdh.mergify-net.metainfo.xml
  - src: packaging/icons/hicolor
    dst: /usr/share/icons/hicolor
    type: tree
  - src: LICENSE
    dst: /usr/share/doc/mergify-net/copyright
    packager: deb
  - src: LICENSE
    dst: /usr/share/licenses/mergify-net/LICENSE
    packager: rpm
  - src: LICENSE
    dst: /usr/share/licenses/mergify-net/LICENSE
    packager: apk
  - src: LICENSE
    dst: /usr/share/licenses/mergify-net/LICENSE
    packager: archlinux
scripts:
  postinstall: packaging/postinstall.sh
overrides:
  deb:
    depends:
      - libcap2-bin
  rpm:
    recommends:
      - libcap
  apk:
    depends:
      - libcap-utils
  archlinux:
    depends:
      - libcap
