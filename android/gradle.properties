# No -Dfile.encoding here: Gradle writes the test worker's @options-file (its classpath) with
# the daemon's default charset, while the java launcher reads @files back with the ANSI
# codepage. Forcing UTF-8 makes every test worker die with ClassNotFoundException on a path
# containing an accent — this repo has one. Sources stay UTF-8 (kotlinc ignores this setting).
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The repo path contains non-ASCII characters (user name with an accent); AGP refuses such
# paths on Windows by default. The native tools (aapt2, d8) handle them fine.
android.overridePathCheck=true
